# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy: agent + redis (+ nginx tùy chọn)
#
#   docker compose up -d                 # agent + redis
#   docker compose up -d --scale agent=3 # nhiều instance (xem ghi chú ports)
#
# Secret đọc từ file .env cùng thư mục qua nội suy ${...}, không viết thẳng ở đây.
# ═══════════════════════════════════════════════════════════════════

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: day12-agent:prod
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      AGENT_API_KEY: ${AGENT_API_KEY}
      # Trong compose, tên service `redis` chính là hostname — không dùng localhost
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Cho uvicorn thời gian xử lý nốt request sau SIGTERM trước khi SIGKILL
    stop_grace_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Mở rộng tùy chọn: load balancer cho nhiều instance agent ──
  # Chỉ chạy khi bật profile: docker compose --profile lb up -d --scale agent=3
  # (Khi scale, bỏ mục `ports` của agent để tránh 3 container tranh cổng 8000
  #  và gọi qua nginx ở http://localhost:8080)
  nginx:
    image: nginx:1.27-alpine
    profiles: ["lb"]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent

volumes:
  redis-data:
